# Pre-commit hooks for grafeo-memory: the same checks CI runs, so a push that passes here passes CI.
# Install once per clone: cargo install prek && prek install   (installs the pre-commit and pre-push hooks)
# Run manually: prek run --all-files   (pre-push stage: prek run --all-files --hook-stage pre-push)
# Docs: https://github.com/j178/prek
#
# On commit: hygiene, typos, ruff check, ruff format, ty, lockfile check (fast).
# On push: the full test suite, on this machine's OS (catches the Windows-only failures before CI).

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Built-in prek hooks
  - repo: builtin
    hooks:
      # Markdown is prose; never rewrite it mechanically
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Typo checker
  - repo: https://github.com/crate-ci/typos
    rev: v1.29.4
    hooks:
      - id: typos

  # Python hooks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: ty-check
        name: ty check
        entry: uv run --frozen ty check .
        language: system
        pass_filenames: false
        types: [python]

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'

      - id: pytest
        name: pytest (full suite)
        entry: uv run --frozen pytest -q -p no:cacheprovider --no-cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
