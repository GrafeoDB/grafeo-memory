[project]
name = "grafeo-memory"
version = "0.3.0"
description = "AI memory layer powered by GrafeoDB's hybrid graph and vector database"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "S.T. Grond" }]
keywords = ["memory", "ai", "graph", "database", "llm", "rag", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "grafeo>=0.6.2,<0.7",
    "pydantic-ai-slim>=1.96",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]", "openai>=1.0"]
anthropic = ["pydantic-ai-slim[anthropic]"]
google = ["pydantic-ai-slim[google]"]
groq = ["pydantic-ai-slim[groq]"]
mistral = ["pydantic-ai-slim[mistral]", "mistralai>=1.0"]
mcp = ["mcp>=2.2,<3"]
# Microsoft Agent Framework vector-store adapter (grafeo_memory.agent_framework)
agent-framework = ["agent-framework-core>=1.25,<2"]
# TypeSafe Jev decision model (grafeo_memory.providers.decision.jev): hosted System One
# API for non-LLM pipeline stages; sends reconciliation state to TypeSafe when used
jev = ["httpx>=0.27"]
# Benchmark harnesses (grafeo_memory.bench) - LOCOMO / LongMemEval / BEAM
bench = ["mistralai>=1.0", "nltk>=3.9", "numpy>=2", "pyarrow>=18"]
all = ["pydantic-ai-slim[openai,anthropic,google,groq,mistral]", "openai>=1.0", "mistralai>=1.0", "httpx>=0.27"]

[project.entry-points."grafeo_memory.decision_models"]
jev = "grafeo_memory.providers.decision.jev:JevDecisionModel"

[project.scripts]
grafeo-memory = "grafeo_memory.cli:main"
grafeo-memory-mcp = "grafeo_memory.mcp.server:main"

[project.urls]
Homepage = "https://github.com/GrafeoDB/grafeo-memory"
Repository = "https://github.com/GrafeoDB/grafeo-memory"
Issues = "https://github.com/GrafeoDB/grafeo-memory/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grafeo_memory"]

[tool.hatch.build.targets.sdist]
# Internal notes and local run data never ship, whatever the local gitignore says.
exclude = [".claude/", ".benchmarks/", "coverage.xml", "*.grafeo", "*.llmcache.jsonl"]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# ── Ty ────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# Tests use mocks/stubs that intentionally don't conform to production protocols.
exclude = ["tests/", "grafeo_memory/bench"]

# Downgrade rules that produce false positives from Rust-extension deps
# without type stubs (grafeo), pydantic-ai Agent overloads, and optional
# dependencies (openai, mistralai) not installed in CI.
[tool.ty.rules]
import-not-found = "warn"
missing-attribute = "warn"
invalid-argument-type = "warn"
no-matching-overload = "warn"
invalid-return-type = "warn"
call-non-callable = "warn"
call-top-callable = "warn"
invalid-assignment = "warn"

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=grafeo_memory --cov-report=term-missing"

# ── Coverage ─────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["grafeo_memory"]
omit = ["*/__init__.py", "grafeo_memory/bench/*"]  # harnesses need datasets and API keys; their offline gates run as subprocesses

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ── Dependency groups (PEP 735) ───────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.15",
    "ty>=0.0.26",
    "agent-framework-core>=1.25,<2",
]

